interface:
  display_name: "Create With Cuebook"
  short_description: "Create a Frame, focused snapshot, or TradingView canvas transfer"
  default_prompt: "Use $create-cuebook-content to recognize the non-obvious edge in my market intuition, expand it with the smallest useful Cuebook Cue or data relationship, and show one complete Frame with exact copy, meaning, time, and actual image before asking once whether to publish it. Default to one native Cuebook Frame; if I explicitly choose an official TradingView snapshot, focus its latest structure and use it only after attribution, overlay rights, price lock, and finished-bitmap review pass. Keep any separately confirmed TradingView drawing transfer distinct from Frame publication."
