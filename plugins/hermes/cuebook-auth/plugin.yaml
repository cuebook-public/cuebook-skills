name: cuebook-auth
version: 0.3.1
description: "Telegram DM OAuth bridge for Cuebook. It normalizes the native OAuth wait, returns a validated approval link, and refreshes MCP Tool discovery after approval."
author: Cuebook
kind: standalone
requires_env:
  - HERMES_DASHBOARD_SESSION_TOKEN
  - HERMES_DASHBOARD_PUBLIC_URL
hooks:
  - pre_gateway_dispatch
