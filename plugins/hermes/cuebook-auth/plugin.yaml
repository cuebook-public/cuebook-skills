name: cuebook-auth
version: 0.2.0
description: "Telegram DM OAuth bridge for Cuebook. It exposes a Connect Cuebook command, returns the validated native OAuth link, and refreshes MCP Tool discovery after approval."
author: Cuebook
kind: standalone
requires_env:
  - HERMES_DASHBOARD_SESSION_TOKEN
  - HERMES_DASHBOARD_PUBLIC_URL
hooks:
  - pre_gateway_dispatch
